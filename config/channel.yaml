# Learn play grow: channel settings and series bible. Every agent reads this file.

channel_name: Learn play grow
audience_age: "3-6"
language: en
format: short animated stories that each teach one simple idea (nature, science, feelings, good habits)
video_minutes: [3, 5]
video: {width: 1920, height: 1080, fps: 30}
art_style: soft watercolor picture-book illustration, warm pastel colors, rounded friendly shapes, gentle light
publish_mode: human_approval   # human_approval | auto_private | auto_scheduled

# Which model each agent uses: any init_chat_model string ("provider:model") plus any extra
# settings that model accepts. Groq free tier; if a model disappears, pick a new one from
# https://console.groq.com/docs/models
# Each model has its own per-minute limit, so spreading agents across models avoids 429s.
# Writer and reviewer use strict structured output (only gpt-oss supports it on Groq): the answer
# is locked to the form, so it can't come back garbled. Keep reasoning_effort low for the writer:
# at medium it spent all its tokens thinking and returned nothing.
llm:
  default:         {model: "groq:openai/gpt-oss-20b", reasoning_effort: low, max_tokens: 2048}
  scriptwriter:    {model: "groq:openai/gpt-oss-120b", reasoning_effort: low, max_tokens: 4500,
                    structured_output: json_schema, strict: true}
  safety_reviewer: {model: "groq:openai/gpt-oss-120b", reasoning_effort: medium, max_tokens: 3000,
                    structured_output: json_schema, strict: true}
  # Looks at every picture. Its free tier allows 7,000 input tokens a minute and each check sends
  # ~2,400, so parallel checks queue at 2.5 a minute. Output is capped at 1,000 tokens a minute,
  # so keep max_tokens well under that.
  vision_check:    {model: "groq:qwen/qwen3.8-27b", structured_output: json_schema, temperature: 0.1,
                    max_tokens: 600, requests_per_minute: 2.5}
  # Tracing videos: picks 3 words per letter. Claude Haiku 5.5 is Anthropic's cheapest model
  # ($0.10 / $0.50 per million tokens): well under a cent per video. Needs ANTHROPIC_API_KEY.
  # No temperature (Haiku 5.5 rejects it); low effort keeps its thinking short.
  letter_planner:  {model: "anthropic:claude-haiku-5-5", effort: low, max_tokens: 2000,
                    structured_output: json_schema}

providers:
  images: cloudflare   # fake | cloudflare (Workers AI free tier: 10,000 neurons a day)
  tts: edge            # fake | edge (Microsoft Edge voices, free) | groq (Orpheus)

edge_voices:
  rate: "-8%"   # a touch slower, for young listeners
  pitch: "+0Hz"

tracing:
  picture_style: cute flat children's book illustration, bold clean outlines, bright friendly colors
  practice_seconds: 4.0   # quiet time for kids to trace along with a finger

cloudflare:
  model: "@cf/black-forest-labs/flux-2-klein-4b"   # ~17 s a picture, ~170 a day free
  render_size: [1024, 576]                          # upscaled to 1920x1080; bigger costs more

vision_check: true

groq_voices:
  model: canopylabs/orpheus-v1-english   # accept its terms once in the Groq console
  requests_per_minute: 9                 # free tier: 10 a minute, 200 characters each

# Background music: drop royalty-free tracks (mp3/wav/m4a/ogg) into assets/music/, or into
# assets/music/<mood>/ to match an episode's mood. No tracks, no music.

# Edge voices: en-US-AvaNeural, en-US-EmmaNeural, en-US-JennyNeural (warm women),
# en-US-AnaNeural, en-GB-MaisieNeural (children), en-US-AndrewNeural (man).
# Samples: output/voice-samples/
narrator_voice: en-US-AnaNeural

# PROPOSED recurring characters. Change or replace them, but keep them original.
characters:
  - id: fennel
    name: Fennel
    species: fox kit
    look: a small fox kit with soft orange fur, a cream-tipped tail, big amber eyes and a tiny green backpack
    personality: curious and bouncy; asks "why?" about everything
    voice: en-US-AnaNeural
  - id: olo
    name: Olo
    species: tortoise
    look: a gentle tortoise with a moss-green shell, a yellow knitted scarf and a small daisy growing on top of the shell
    personality: patient and kind; loves facts and explains them slowly
    voice: en-US-AndrewNeural
  - id: glim
    name: Glim
    species: firefly
    look: a tiny round firefly with lilac wings and a tail that glows warm yellow when she has an idea
    personality: playful and quick; lights up with excitement
    voice: en-GB-MaisieNeural
